[project]
name = "clipora-ai-backend"
version = "1.0.0"
description = "Clipora AI backend for video transcription, scene detection, NLP highlight extraction, and HD FFmpeg shorts rendering."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "faster-whisper>=1.1.0",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "vaderSentiment>=3.3.2",
    "static-ffmpeg>=2.7",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
